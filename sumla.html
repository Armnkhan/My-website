<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Magical Secret For You ❤️</title>
    <meta name="google-site-verification" content="KmR7xmCm1MvhQvr4zVEzVjuOIVvTquF1F4cgMXUZCqs" />

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            padding: 15px;
        }

        /* Creator / Form Section */
        .creator-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            z-index: 100;
            max-height: 90vh;
            overflow-y: auto;
        }

        .creator-box h2 {
            color: #ff3366;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
        }

        .input-group textarea {
            resize: none;
            height: 70px;
        }

        .generate-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            font-weight: 600;
            transition: 0.3s;
            margin-top: 5px;
        }

        .generate-btn:hover {
            transform: scale(1.02);
        }

        .result-box {
            margin-top: 15px;
            display: none;
        }

        .result-box input {
            width: 100%;
            padding: 8px;
            font-size: 0.8rem;
            border: 1px dashed #ff3366;
            border-radius: 5px;
            background: #fff0f3;
            text-align: center;
            margin-bottom: 8px;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            width: 100%;
        }

        /* --- Receiver View --- */
        .receiver-view {
            display: none;
            text-align: center;
            z-index: 50;
            padding: 20px;
        }

        .surprise-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(255, 65, 108, 0.9); }
            100% { transform: scale(1); }
        }

        .name-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.5s;
            z-index: 60;
            padding: 20px;
        }

        .name-overlay.active { opacity: 1; pointer-events: auto; }

        .name-popup-box {
            background: white; 
            padding: 30px 20px; 
            border-radius: 20px; 
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .clickable-name {
            display: inline-block; 
            font-size: 2.2rem; 
            color: #ff3366; 
            font-weight: bold; 
            cursor: pointer;
            text-shadow: 0 2px 10px rgba(255,51,102,0.3);
            transition: 0.3s;
            word-break: break-word;
        }
        .clickable-name:hover { transform: scale(1.08); }

        /* Magic Loading / Music Screen */
        .magic-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none; justify-content: center; align-items: center; flex-direction: column;
            z-index: 70; color: white; text-align: center;
            padding: 20px;
        }

        .magic-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-family: 'Great Vibes', cursive;
            color: #ff9a9e;
        }

        .equalizer {
            display: flex; gap: 5px; height: 30px; align-items: flex-end; margin-top: 15px;
        }
        .bar {
            width: 6px; background: #ff3366; animation: bounce 0.6s infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.1s; }

        @keyframes bounce {
            0% { height: 10px; }
            100% { height: 40px; }
        }

        /* Stunning Love Letter */
        .letter-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 1s;
            z-index: 80;
            padding: 15px;
        }

        .letter-container.active { opacity: 1; pointer-events: auto; }

        .letter {
            background: #fffdf9; 
            width: 100%; 
            max-width: 520px; 
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px 20px; 
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(255, 105, 180, 0.6); 
            position: relative; 
            border: 3px double #ffb6c1;
            transform: scale(0.3) rotate(-10deg); 
            transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .letter-container.active .letter { transform: scale(1) rotate(0deg); }

        .letter h1 { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: #d63384; margin-bottom: 10px; text-align: center; }
        .letter p { font-size: 1.05rem; color: #444; line-height: 1.7; margin-bottom: 15px; text-align: center; word-break: break-word; }
        .letter .signature { font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: #333; text-align: right; margin-top: 20px; }
        .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #888; }

        /* Full Screen Burst Hearts */
        .explosion-heart {
            position: fixed;
            font-size: 24px;
            animation: burst 2s ease-out forwards;
            pointer-events: none;
            z-index: 90;
        }

        @keyframes burst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.6); opacity: 0; }
        }

        /* --- MEDIA QUERIES FOR LAPTOPS, TABLETS & DESKTOPS --- */
        @media (min-width: 768px) {
            .creator-box {
                padding: 35px;
                max-width: 480px;
            }
            .creator-box h2 {
                font-size: 2rem;
            }
            .input-group input, .input-group textarea {
                font-size: 1rem;
            }
            .input-group textarea {
                height: 85px;
            }
            .surprise-btn {
                padding: 18px 40px;
                font-size: 1.4rem;
            }
            .name-popup-box {
                padding: 40px;
                max-width: 450px;
            }
            .clickable-name {
                font-size: 2.8rem;
            }
            .magic-screen h2 {
                font-size: 2.3rem;
            }
            .letter {
                padding: 45px;
                max-width: 580px;
            }
            .letter h1 {
                font-size: 3.5rem;
            }
            .letter p {
                font-size: 1.15rem;
            }
            .letter .signature {
                font-size: 2.2rem;
            }
            .explosion-heart {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <!-- CREATOR FORM -->
    <div class="creator-box" id="creatorSection">
        <h2>✨ Unique Love Generator</h2>
        <div class="input-group">
            <label>Partner's Name:</label>
            <input type="text" id="gfName" placeholder="sumla..........">
        </div>
        <div class="input-group">
            <label>Your Special Message:</label>
            <textarea id="gfMessage" placeholder="Enter your lovely Message.........."></textarea>
        </div>
        <div class="input-group">
            <label>Song Link (YouTube / Shorts / MP3):</label>
            <input type="text" id="songLink" placeholder="Paste YouTube/Shorts or MP3 link here..........">
        </div>
        <div class="input-group">
            <label>Your Name:</label>
            <input type="text" id="senderName" placeholder="Armn...........">
        </div>
        <button class="generate-btn" onclick="generateLink()">Create Magic Link 🚀</button>

        <div class="result-box" id="resultBox">
            <label>Your Unique Link:</label>
            <input type="text" id="generatedLink" readonly>
            <button class="copy-btn" onclick="copyLink()">copy your link 📋</button>
        </div>
    </div>

    <!-- RECEIVER VIEW -->
    <div class="receiver-view" id="receiverSection">
        <button class="surprise-btn" onclick="showNamePopup()">Open Your Surprise ❤️</button>
    </div>

    <!-- NAME POPUP -->
    <div class="name-overlay" id="nameOverlay">
        <div class="name-popup-box">
            <h3 style="color:#666; margin-bottom:10px; font-size: 1rem;">For the most special one...</h3>
            <span class="clickable-name" id="displayName" onclick="startMagicShow()"></span>
            <p style="font-size:0.8rem; color:#888; margin-top:12px;">(Click on your name to start the magic!)</p>
        </div>
    </div>

    <!-- MAGIC LOADING & SONG SCREEN -->
    <div class="magic-screen" id="magicScreen">
        <h2>This is for you & Song... 🎶</h2>
        <p id="songStatusText" style="color:#ffb6c1; font-size:1rem;">Playing my favorite song...</p>
        <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <div id="youtubePlayerContainer" style="display:none;"></div>
    </div>

    <!-- LOVE LETTER -->
    <div class="letter-container" id="letterContainer">
        <div class="letter">
            <button class="close-btn" onclick="closeLetter()">&times;</button>
            <h1 id="letterTitle">My Dearest Love,</h1>
            <p id="displayMessage">Message here...</p>
            <div class="signature" id="displaySender">Your truly</div>
        </div>
    </div>

    <audio id="bgMusic" preload="auto"></audio>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const paramTo = urlParams.get('to');
        const paramMsg = urlParams.get('msg');
        const paramSong = urlParams.get('song');
        const paramFrom = urlParams.get('from');

        let isYouTube = false;
        let ytPlayer = null;

        if (paramTo && paramMsg && paramFrom) {
            document.getElementById('creatorSection').style.display = 'none';
            document.getElementById('receiverSection').style.display = 'block';

            document.getElementById('displayName').innerText = paramTo + " ❤️";
            document.getElementById('displayMessage').innerText = decodeURIComponent(paramMsg);
            document.getElementById('displaySender').innerText = decodeURIComponent(paramFrom);
            
            if(paramSong) {
                let decodedSong = decodeURIComponent(paramSong);
                if (decodedSong.includes('youtube.com') || decodedSong.includes('youtu.be')) {
                    isYouTube = true;
                    let tag = document.createElement('script');
                    tag.src = "https://www.youtube.com/iframe_api";
                    let firstScriptTag = document.getElementsByTagName('script')[0];
                    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                } else {
                    document.getElementById('bgMusic').src = decodedSong;
                }
            }
        }

        function onYouTubeIframeAPIReady() {
            if (isYouTube && paramSong) {
                let decodedSong = decodeURIComponent(paramSong);
                let videoId = getYouTubeId(decodedSong);
                if(videoId) {
                    ytPlayer = new YT.Player('youtubePlayerContainer', {
                        height: '0',
                        width: '0',
                        videoId: videoId,
                        playerVars: {
                            'autoplay': 0,
                            'controls': 0
                        }
                    });
                }
            }
        }

        function getYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function generateLink() {
            let to = document.getElementById('gfName').value.trim();
            let msg = document.getElementById('gfMessage').value.trim();
            let song = document.getElementById('songLink').value.trim();
            let from = document.getElementById('senderName').value.trim();

            if (!to || !msg || !from) {
                alert("It is mandatory to fill in the name and message!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const finalLink = `${baseUrl}?to=${encodeURIComponent(to)}&msg=${encodeURIComponent(msg)}&song=${encodeURIComponent(song)}&from=${encodeURIComponent(from)}`;

            document.getElementById('generatedLink').value = finalLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const copyText = document.getElementById('generatedLink');
            copyText.select();
            document.execCommand('copy');
            alert("Unique link copied! Now send it to your sweetheart.❤️");
        }

        function showNamePopup() {
            document.getElementById('nameOverlay').classList.add('active');
        }

        function startMagicShow() {
            document.getElementById('nameOverlay').classList.remove('active');
            triggerHeartExplosion();

            if (isYouTube && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                ytPlayer.unMute();
                ytPlayer.setVolume(100);
                ytPlayer.playVideo();
            } else {
                const music = document.getElementById('bgMusic');
                music.volume = 1.0;
                music.play().catch(e => console.log("Audio play error: ", e));
            }

            document.getElementById('magicScreen').style.display = 'flex';

            setTimeout(() => {
                fadeAndStopMusic();
            }, 12000); 

            setTimeout(() => {
                document.getElementById('magicScreen').style.display = 'none';
                document.getElementById('letterContainer').classList.add('active');
            }, 14000); 
        }

        function fadeAndStopMusic() {
            if (isYouTube && ytPlayer && typeof ytPlayer.setVolume === 'function') {
                let vol = 100;
                let fadeInterval = setInterval(() => {
                    vol -= 10;
                    if (vol >= 0) {
                        ytPlayer.setVolume(vol);
                    } else {
                        clearInterval(fadeInterval);
                        ytPlayer.stopVideo();
                    }
                }, 200);
            } else {
                const music = document.getElementById('bgMusic');
                let vol = 1.0;
                let fadeInterval = setInterval(() => {
                    vol -= 0.1;
                    if (vol > 0) {
                        music.volume = vol.toFixed(1);
                    } else {
                        clearInterval(fadeInterval);
                        music.pause();
                        music.volume = 1.0;
                    }
                }, 200);
            }
        }

        function triggerHeartExplosion() {
            for (let i = 0; i < 70; i++) {
                const heart = document.createElement('div');
                heart.classList.add('explosion-heart');
                heart.innerHTML = '❤️';
                
                heart.style.left = window.innerWidth / 2 + 'px';
                heart.style.top = window.innerHeight / 2 + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * (window.innerWidth / 1.5);
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                heart.style.setProperty('--x', x + 'px');
                heart.style.setProperty('--y', y + 'px');
                heart.style.animationDuration = (Math.random() * 1 + 1.2) + 's';

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 2000);
            }
        }

        function closeLetter() {
            document.getElementById('letterContainer').classList.remove('active');
            if (isYouTube && ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                ytPlayer.stopVideo();
            } else {
                document.getElementById('bgMusic').pause();
            }
        }
    </script>
</body>
</html>
